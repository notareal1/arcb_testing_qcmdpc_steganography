[package]
name = "arcb-stegano-trapdoor"
version = "5.13.0"
edition = "2021"
authors = ["notareal1"]
description = "ARCB-SteganoTrapdoor v5.13: post-quantum KEM + steganographic trapdoor (security hardened)"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
blake3 = "1.5"
sha3 = "0.10"
rand = "0.8"
getrandom = "0.2"
thiserror = "1.0"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
subtle = "2.6"
rayon = "1.10"


[build-dependencies]
cc = "1.1"

[dev-dependencies]
rand = "0.8"
dudect-bencher = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
